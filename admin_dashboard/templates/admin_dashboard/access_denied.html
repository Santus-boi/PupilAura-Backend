{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied | PupilAura Admin</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <style>
        /* =========================================================
           ACCESS DENIED — STANDALONE PAGE
           ========================================================= */

        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --text: #111827;
            --muted: #6b7280;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e5e7eb;
            --shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(220, 38, 38, 0.08), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .access-container {
            width: 100%;
            max-width: 560px;
        }

        .access-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
            border-radius: 18px;
            background: var(--primary);
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(220, 38, 38, 0.10);
            color: var(--primary);
            font-size: 34px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(28px, 5vw, 38px);
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .message {
            max-width: 430px;
            margin: 0 auto 30px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.20);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(220, 38, 38, 0.25);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 28px;
            color: var(--muted);
            font-size: 13px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #f9fafb;
                --muted: #9ca3af;
                --bg: #0f172a;
                --card: #111827;
                --border: #1f2937;
                --shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
            }

            .btn-secondary {
                background: #111827;
                color: #f9fafb;
                border-color: #374151;
            }

            .btn-secondary:hover {
                background: #1f2937;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 16px;
            }

            .access-card {
                padding: 36px 22px;
                border-radius: 20px;
            }

            .logo {
                width: 58px;
                height: 58px;
                margin-bottom: 20px;
            }

            .icon {
                width: 64px;
                height: 64px;
                margin-bottom: 20px;
            }

            .message {
                font-size: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="access-container">
        <section class="access-card">

            <div class="logo" aria-label="PupilAura">
                PA
            </div>

            <div class="icon" aria-hidden="true">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h1>Access Denied</h1>

            <p class="message">
                You do not have permission to access the PupilAura
                Admin Dashboard.
            </p>

            <div class="actions">
                <a href="{% url 'admin_dashboard:dashboard' %}" class="btn btn-primary">
                    <i class="bi bi-grid-1x2-fill"></i>
                    Return to Dashboard
                </a>

                <a href="/" class="btn btn-secondary">
                    <i class="bi bi-house-fill"></i>
                    Return Home
                </a>
            </div>

            <p class="footer">
                PupilAura Admin Portal
            </p>

        </section>
    </main>

</body>
</html>
