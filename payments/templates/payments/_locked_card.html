{% load payments %}
{# Usage: {% include "payments/_locked_card.html" with content_type="subject" content_id=subject.id label=subject.name %} #}

<div style="padding: 30px; border: 1px dashed #cbd5e1; border-radius: 16px; background: radial-gradient(500px 260px at 50% 0%, rgba(37,99,235,0.06), transparent 60%), white; text-align: center;">

    <div style="width: 68px; height: 68px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 18px; background: var(--primary-soft); color: var(--primary); font-size: 28px;">
        <i class="bi bi-lock-fill"></i>
    </div>

    <h3 style="margin: 0 0 10px; font: 800 22px 'Plus Jakarta Sans', sans-serif; color: var(--ink); letter-spacing: -0.4px;">
        Unlock this content
    </h3>

    <p style="max-width: 460px; margin: 0 auto 24px; color: var(--muted); font-size: 15px; line-height: 1.7;">
        Get <strong>90 days</strong> of unlimited access to {{ label }}.
        Pay securely or redeem a promo code.
    </p>

    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
        <a href="{% url 'payments:checkout' content_type content_id %}" class="pa-btn-primary">
            <i class="bi bi-lock-open-fill"></i>
            Unlock now
        </a>
        <a href="{% url 'student_dashboard' %}" class="pa-btn-outline">
            <i class="bi bi-arrow-left"></i>
            Back to dashboard
        </a>
    </div>

</div>
