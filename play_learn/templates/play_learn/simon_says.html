
{% extends "base.html" %}

{% block title %}Simon Says | PupilAura Play & Learn{% endblock %}

{% block content %}
<style>
    .simon-game {
        max-width: 760px;
        margin: 30px auto;
        padding: 24px;
        color: #fff;
        background: #111827;
        border-radius: 24px;
        font-family: Arial, sans-serif;
    }

    .simon-header { text-align: center; margin-bottom: 22px; }
    .simon-header h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; }
    .simon-header p { color: #cbd5e1; }

    .simon-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .simon-stat {
        padding: 14px 8px;
        text-align: center;
        background: #1f2937;
        border-radius: 14px;
    }

    .simon-stat span { display: block; color: #cbd5e1; font-size: .85rem; }
    .simon-stat strong { display: block; font-size: 1.6rem; margin-top: 5px; }

    .simon-panel {
        padding: 22px;
        background: #1f2937;
        border-radius: 20px;
        text-align: center;
    }

    .simon-status {
        min-height: 55px;
        display: grid;
        place-items: center;
        margin-bottom: 15px;
        color: #e5e7eb;
        font-size: 1.1rem;
        font-weight: 700;
    }

    .simon-board {
        width: min(100%, 390px);
        aspect-ratio: 1;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .simon-pad {
        border: 4px solid rgba(255,255,255,.12);
        border-radius: 24px;
        cursor: pointer;
        opacity: .75;
        transition: opacity .12s, transform .12s, filter .12s;
        touch-action: manipulation;
    }

    .simon-pad:disabled { cursor: not-allowed; }
    .simon-pad.active {
        opacity: 1;
        filter: brightness(1.65);
        transform: scale(.96);
        border-color: #fff;
        box-shadow: 0 0 30px rgba(255,255,255,.4);
    }

    .simon-pad:focus-visible {
        outline: 4px solid white;
        outline-offset: 4px;
    }

    .pad-green { background: #16a34a; }
    .pad-red { background: #dc2626; }
    .pad-yellow { background: #eab308; }
    .pad-blue { background: #2563eb; }

    .simon-controls {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
    }

    .simon-btn {
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
    }

    .simon-start { color: #111827; background: #a78bfa; }
    .simon-secondary { color: white; background: #475569; }

    .simon-difficulty {
        margin-top: 10px;
        padding: 10px 14px;
        border: 1px solid #64748b;
        border-radius: 10px;
        color: white;
        background: #111827;
    }

    .simon-result {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #111827;
        border-radius: 16px;
    }

    .simon-result h2 { color: #c4b5fd; }

    @media (max-width: 520px) {
        .simon-game { margin: 12px; padding: 14px; }
        .simon-panel { padding: 14px; }
        .simon-board { gap: 8px; }
        .simon-pad { border-radius: 17px; }
        .simon-stat { padding: 10px 4px; }
        .simon-stat strong { font-size: 1.3rem; }
    }
</style>

<div class="simon-game">
    <header class="simon-header">
        <h1>🧠 Simon Says</h1>
        <p>Watch the colors. Remember the sequence. Repeat it correctly!</p>
    </header>

    <div class="simon-stats">
        <div class="simon-stat">
            <span>Level</span>
            <strong id="simonLevel">0</strong>
        </div>
        <div class="simon-stat">
            <span>Score</span>
            <strong id="simonScore">0</strong>
        </div>
        <div class="simon-stat">
            <span>Best Level</span>
            <strong id="simonBest">0</strong>
        </div>
    </div>

    <section class="simon-panel">
        <div class="simon-status" id="simonStatus" aria-live="polite">
            Choose a difficulty and press Start Game.
        </div>

        <label for="simonDifficulty">Difficulty</label>
        <br>
        <select id="simonDifficulty" class="simon-difficulty">
            <option value="easy">Easy — Slow sequence</option>
            <option value="medium" selected>Medium — Normal sequence</option>
            <option value="hard">Hard — Fast sequence</option>
        </select>

        <div class="simon-board" id="simonBoard">
            <button type="button" class="simon-pad pad-green" data-pad="0" aria-label="Green" disabled></button>
            <button type="button" class="simon-pad pad-red" data-pad="1" aria-label="Red" disabled></button>
            <button type="button" class="simon-pad pad-yellow" data-pad="2" aria-label="Yellow" disabled></button>
            <button type="button" class="simon-pad pad-blue" data-pad="3" aria-label="Blue" disabled></button>
        </div>

        <div class="simon-controls">
            <button type="button" class="simon-btn simon-start" id="simonStart">
                Start Game
            </button>
            <button type="button" class="simon-btn simon-secondary" id="simonRestart" hidden>
                Play Again
            </button>
        </div>

        <div class="simon-result" id="simonResult" aria-live="polite">
            <h2>🏆 Game Over!</h2>
            <p id="simonFinalScore"></p>
            <p id="simonFinalLevel"></p>
            <p id="simonBestResult"></p>
        </div>
    </section>
</div>

<script>
(() => {
    const $ = id => document.getElementById(id);

    const pads = [...document.querySelectorAll(".simon-pad")];

    const speeds = {
        easy: { flash: 650, pause: 350 },
        medium: { flash: 430, pause: 250 },
        hard: { flash: 260, pause: 150 }
    };

    let sequence = [];
    let playerIndex = 0;
    let level = 0;
    let score = 0;
    let bestLevel = 0;
    let playing = false;
    let acceptingInput = false;
    let soundContext = null;
    let playbackToken = 0;

    const frequencies = [329.63, 261.63, 220, 164.81];

    try {
        bestLevel = Number(localStorage.getItem("pupilauraSimonBest")) || 0;
    } catch (error) {
        bestLevel = 0;
    }

    $("simonBest").textContent = bestLevel;

    function updateStats() {
        $("simonLevel").textContent = level;
        $("simonScore").textContent = score;
        $("simonBest").textContent = bestLevel;
    }

    function setPadsEnabled(enabled) {
        pads.forEach(pad => {
            pad.disabled = !enabled;
        });
    }

    function playTone(index) {
        try {
            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) return;

            if (!soundContext) {
                soundContext = new AudioContextClass();
            }

            if (soundContext.state === "suspended") {
                soundContext.resume();
            }

            const oscillator = soundContext.createOscillator();
            const gain = soundContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = frequencies[index];

            gain.gain.setValueAtTime(0.001, soundContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.18,
                soundContext.currentTime + 0.025
            );
            gain.gain.exponentialRampToValueAtTime(
                0.001,
                soundContext.currentTime + 0.25
            );

            oscillator.connect(gain);
            gain.connect(soundContext.destination);

            oscillator.start();
            oscillator.stop(soundContext.currentTime + 0.26);
        } catch (error) {
            // Visual gameplay continues if audio is unavailable.
        }
    }

    function flashPad(index, duration) {
        return new Promise(resolve => {
            const pad = pads[index];

            pad.classList.add("active");
            playTone(index);

            window.setTimeout(() => {
                pad.classList.remove("active");
                resolve();
            }, duration);
        });
    }

    function wait(milliseconds) {
        return new Promise(resolve => {
            window.setTimeout(resolve, milliseconds);
        });
    }

    async function playSequence() {
        const token = ++playbackToken;
        acceptingInput = false;
        setPadsEnabled(false);

        const difficulty = speeds[$("simonDifficulty").value];

        $("simonStatus").textContent = "👀 Watch the sequence carefully!";

        await wait(500);

        for (const index of sequence) {
            if (!playing || token !== playbackToken) return;

            await flashPad(index, difficulty.flash);
            await wait(difficulty.pause);
        }

        if (!playing || token !== playbackToken) return;

        playerIndex = 0;
        acceptingInput = true;
        setPadsEnabled(true);

        $("simonStatus").textContent = "🎮 Your turn! Repeat the sequence.";
    }

    function nextRound() {
        if (!playing) return;

        level++;
        playerIndex = 0;

        sequence.push(Math.floor(Math.random() * 4));

        updateStats();
        playSequence();
    }

    function handlePadClick(index) {
        if (!playing || !acceptingInput) return;

        flashPad(index, 160);

        if (sequence[playerIndex] !== index) {
            endGame();
            return;
        }

        playerIndex++;
        score += 10;
        updateStats();

        if (playerIndex === sequence.length) {
            acceptingInput = false;
            setPadsEnabled(false);

            score += level * 5;
            updateStats();

            $("simonStatus").textContent = "✅ Excellent! Next level...";
            window.setTimeout(nextRound, 800);
        }
    }

    function endGame() {
        playing = false;
        acceptingInput = false;
        playbackToken++;

        setPadsEnabled(false);

        if (level > bestLevel) {
            bestLevel = level;

            try {
                localStorage.setItem("pupilauraSimonBest", String(bestLevel));
            } catch (error) {
                // Best-level storage is optional.
            }
        }

        updateStats();

        $("simonStatus").textContent = "❌ Wrong sequence! Game over.";
        $("simonFinalScore").textContent = `Your score: ${score} points`;
        $("simonFinalLevel").textContent = `Levels completed: ${Math.max(0, level - 1)}`;
        $("simonBestResult").textContent = `Best level: ${bestLevel}`;

        $("simonResult").style.display = "block";
        $("simonStart").hidden = true;
        $("simonRestart").hidden = false;
        $("simonDifficulty").disabled = false;
    }

    function startGame() {
        playbackToken++;

        sequence = [];
        playerIndex = 0;
        level = 0;
        score = 0;
        playing = true;
        acceptingInput = false;

        $("simonResult").style.display = "none";
        $("simonStart").hidden = true;
        $("simonRestart").hidden = true;
        $("simonDifficulty").disabled = true;

        pads.forEach(pad => pad.classList.remove("active"));

        updateStats();
        nextRound();
    }

    pads.forEach(pad => {
        pad.addEventListener("click", () => {
            handlePadClick(Number(pad.dataset.pad));
        });
    });

    $("simonStart").addEventListener("click", startGame);
    $("simonRestart").addEventListener("click", startGame);

    updateStats();
})();
</script>
{% endblock %}
